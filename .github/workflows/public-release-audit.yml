name: Temporary dependency repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release-prep branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/public-release-prep
          fetch-depth: 0

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify high-severity findings are cleared
        run: npm audit --audit-level=high

      - name: Build the application
        run: npm run build

      - name: Commit verified lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json || {
            echo "npm audit fix unexpectedly changed package.json; refusing automated commit."
            exit 1
          }
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: repair audited development dependencies"
          git push origin HEAD:agent/public-release-prep
