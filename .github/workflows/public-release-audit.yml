name: Temporary dependency repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release-prep branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/public-release-prep
          fetch-depth: 0

      - name: Upgrade vulnerable build toolchain
        run: npm install --save-dev vite@8.2.1 @vitejs/plugin-react@latest

      - name: Verify high-severity findings are cleared
        run: npm audit --audit-level=high

      - name: Build the application
        run: npm run build

      - name: Commit verified toolchain repair
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -Ev '^ M (package.json|package-lock.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed; refusing automated commit:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade audited build toolchain"
          git push origin HEAD:agent/public-release-prep
